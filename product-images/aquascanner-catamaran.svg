<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#103544" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#05151e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be7e4"/>
      <stop offset="100%" stop-color="#228b8e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="none"/>
  <circle cx="300" cy="225" r="180" fill="url(#bg-glow)"/>
  <circle cx="300" cy="225" r="160" fill="none" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="300" cy="225" r="100" fill="none" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.1"/>
  <line x1="100" y1="225" x2="500" y2="225" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="2 4"/>
  <line x1="300" y1="50" x2="300" y2="400" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="2 4"/>

  <!-- Acoustic Sonar Beam Fan -->
  <polygon points="300,285 200,410 400,410" fill="url(#cyan-grad)" fill-opacity="0.12"/>
  <line x1="300" y1="285" x2="200" y2="410" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="300" y1="285" x2="400" y2="410" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <path d="M230,370 Q300,385 370,370" fill="none" stroke="#8be7e4" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M210,400 Q300,420 390,400" fill="none" stroke="#8be7e4" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Twin Hull Catamaran -->
  <path d="M170,260 L200,165 Q230,170 235,260 Q200,280 170,260 Z" fill="#0d2735" stroke="#8be7e4" stroke-width="2" filter="url(#glow)"/>
  <path d="M365,260 L370,165 Q400,170 430,260 Q400,280 365,260 Z" fill="#0d2735" stroke="#8be7e4" stroke-width="2" filter="url(#glow)"/>
  <rect x="215" y="190" width="170" height="75" rx="8" fill="#113646" stroke="#8be7e4" stroke-width="1.5"/>
  
  <!-- Solar Panels / Electronics Bay -->
  <rect x="230" y="200" width="65" height="55" rx="3" fill="#071b24" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="230" y1="227" x2="295" y2="227" stroke="#8be7e4" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="262" y1="200" x2="262" y2="255" stroke="#8be7e4" stroke-width="0.8" stroke-opacity="0.4"/>
  <rect x="305" y="200" width="65" height="55" rx="3" fill="#071b24" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="305" y1="227" x2="370" y2="227" stroke="#8be7e4" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="337" y1="200" x2="337" y2="255" stroke="#8be7e4" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Mast & Telemetry Dome -->
  <line x1="300" y1="190" x2="300" y2="115" stroke="#8be7e4" stroke-width="2.5"/>
  <circle cx="300" cy="110" r="12" fill="#8be7e4" filter="url(#glow)"/>
  <circle cx="300" cy="110" r="6" fill="#041018"/>
  <path d="M280,95 Q300,82 320,95" fill="none" stroke="#8be7e4" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="2 2"/>
  <path d="M265,82 Q300,65 335,82" fill="none" stroke="#8be7e4" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3"/>

  <!-- Forward Nav Headlamps -->
  <circle cx="210" cy="168" r="4" fill="#8be7e4" filter="url(#glow)"/>
  <circle cx="390" cy="168" r="4" fill="#8be7e4" filter="url(#glow)"/>

  <!-- HUD Labels -->
  <text x="300" y="335" font-family="'DM Mono', monospace" font-size="11" fill="#8be7e4" text-anchor="middle" letter-spacing="2">AQUASCANNER ASV</text>
  <text x="300" y="352" font-family="'DM Mono', monospace" font-size="9" fill="#a1b2b7" text-anchor="middle" letter-spacing="1">AUTONOMOUS SURFACE PLATFORM</text>
</svg>