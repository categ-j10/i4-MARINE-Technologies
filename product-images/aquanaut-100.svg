<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow-rov" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#103544" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#05151e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8be7e4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8be7e4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-rov" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="450" fill="none"/>
  <circle cx="300" cy="225" r="180" fill="url(#bg-glow-rov)"/>
  <circle cx="300" cy="225" r="160" fill="none" stroke="#8be7e4" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6"/>

  <!-- High-Output Floodlight Beams -->
  <polygon points="245,175 120,60 180,40" fill="url(#cone-light)"/>
  <polygon points="355,175 420,40 480,60" fill="url(#cone-light)"/>

  <!-- ROV Outer Protective Tubular Cage -->
  <rect x="180" y="150" width="240" height="160" rx="14" fill="#0d2735" stroke="#8be7e4" stroke-width="2.5" filter="url(#glow-rov)"/>
  
  <!-- Buoyancy Foam Blocks Top -->
  <rect x="195" y="135" width="95" height="22" rx="4" fill="#228b8e" stroke="#8be7e4" stroke-width="1.5"/>
  <rect x="310" y="135" width="95" height="22" rx="4" fill="#228b8e" stroke="#8be7e4" stroke-width="1.5"/>

  <!-- Central Electronics Pressure Vessel -->
  <circle cx="300" cy="230" r="52" fill="#05151e" stroke="#8be7e4" stroke-width="2"/>
  <circle cx="300" cy="230" r="34" fill="#113646" stroke="#8be7e4" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="300" cy="230" r="16" fill="#041018" stroke="#8be7e4" stroke-width="2"/>
  <circle cx="304" cy="226" r="5" fill="#8be7e4" filter="url(#glow-rov)"/>

  <!-- Dual LED Floodlight Pods -->
  <rect x="230" y="165" width="26" height="22" rx="4" fill="#8be7e4" filter="url(#glow-rov)"/>
  <circle cx="243" cy="176" r="7" fill="#fff"/>
  <rect x="344" y="165" width="26" height="22" rx="4" fill="#8be7e4" filter="url(#glow-rov)"/>
  <circle cx="357" cy="176" r="7" fill="#fff"/>

  <!-- Thrusters -->
  <rect x="155" y="160" width="22" height="40" rx="4" fill="#113646" stroke="#8be7e4" stroke-width="1.5"/>
  <line x1="150" y1="180" x2="165" y2="180" stroke="#8be7e4" stroke-width="2"/>
  <rect x="423" y="160" width="22" height="40" rx="4" fill="#113646" stroke="#8be7e4" stroke-width="1.5"/>
  <line x1="435" y1="180" x2="450" y2="180" stroke="#8be7e4" stroke-width="2"/>
  <rect x="155" y="255" width="22" height="40" rx="4" fill="#113646" stroke="#8be7e4" stroke-width="1.5"/>
  <rect x="423" y="255" width="22" height="40" rx="4" fill="#113646" stroke="#8be7e4" stroke-width="1.5"/>

  <!-- Umbilical Tether Cable -->
  <path d="M300,310 Q300,380 250,420" fill="none" stroke="#8be7e4" stroke-width="4" stroke-linecap="round" filter="url(#glow-rov)"/>

  <!-- HUD Text -->
  <text x="300" y="355" font-family="'DM Mono', monospace" font-size="11" fill="#8be7e4" text-anchor="middle" letter-spacing="2">AQUA-NAUT 100</text>
  <text x="300" y="372" font-family="'DM Mono', monospace" font-size="9" fill="#a1b2b7" text-anchor="middle" letter-spacing="1">100M PORTABLE SUBSEA ROV</text>
</svg>